name: verify-core

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run headless Core suite
        run: dotnet test .verify-core/Kitesim.Core.Verify.csproj --nologo
